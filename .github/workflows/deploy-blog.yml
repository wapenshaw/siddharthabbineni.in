name: Deploy the blog

# blog.siddharthabbineni.in (master) and blog-staging.siddharthabbineni.in
# (staging), from apps/blog. It builds to plain files in out/, which Azure
# serves from its edge with no server.
on:
  push:
    branches:
      - master
      - staging
    paths:
      - apps/blog/**
      - .github/workflows/deploy-blog.yml
  workflow_dispatch:

jobs:
  deploy:
    name:  ${{ github.ref == 'refs/heads/master' && 'Production' || 'Staging' }} - Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SWA_TOKEN: ${{ github.ref == 'refs/heads/master' && secrets.AZURE_SWA_DEPLOY_TOKEN_BLOG_PROD || secrets.AZURE_SWA_DEPLOY_TOKEN_BLOG_STAGING }}

    defaults:
      run:
        working-directory: apps/blog

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/blog/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/blog/.next/cache
          key: blog-${{ runner.os }}-${{ hashFiles('apps/blog/package-lock.json') }}-${{ hashFiles('apps/blog/**/*.ts', 'apps/blog/**/*.tsx', 'apps/blog/**/*.css', 'apps/blog/posts/**') }}
          restore-keys: |
            blog-${{ runner.os }}-${{ hashFiles('apps/blog/package-lock.json') }}-
            blog-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ github.ref == 'refs/heads/master' && 'https://blog.siddharthabbineni.in' || 'https://blog-staging.siddharthabbineni.in' }}
          NEXT_PUBLIC_PORTFOLIO_URL: ${{ github.ref == 'refs/heads/master' && 'https://www.siddharthabbineni.in' || 'https://staging.siddharthabbineni.in' }}

      # Staging must never be indexed; every file Azure serves gets the header
      - name: Keep staging out of search engines
        if: github.ref != 'refs/heads/master'
        run: |
          node -e "
            const fs = require('fs')
            const file = 'out/staticwebapp.config.json'
            const config = JSON.parse(fs.readFileSync(file, 'utf8'))
            config.globalHeaders = { ...config.globalHeaders, 'X-Robots-Tag': 'noindex, nofollow' }
            fs.writeFileSync(file, JSON.stringify(config, null, 2))
          "

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: apps/blog/out
          output_location: ''
          skip_app_build: true
