name: Deploy the blog

# blog.siddharthabbineni.in, from apps/blog. It builds to plain files in out/, which Azure
# serves from its edge with no server.
on:
  push:
    branches:
      - master
    paths:
      - apps/blog/**
      - .github/workflows/deploy-blog.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SWA_TOKEN: ${{ secrets.AZURE_SWA_DEPLOY_TOKEN_BLOG_PROD }}

    defaults:
      run:
        working-directory: apps/blog

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/blog/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/blog/.next/cache
          key: blog-${{ runner.os }}-${{ hashFiles('apps/blog/package-lock.json') }}-${{ hashFiles('apps/blog/**/*.ts', 'apps/blog/**/*.tsx', 'apps/blog/**/*.css', 'apps/blog/posts/**') }}
          restore-keys: |
            blog-${{ runner.os }}-${{ hashFiles('apps/blog/package-lock.json') }}-
            blog-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: apps/blog/out
          output_location: ''
          skip_app_build: true

      # After the deploy, so the images and covers the copies link to are live.
      # One way only: the blog's own posts go out, nothing comes back.
      - name: Copy new and changed posts to dev.to
        run: npm run devto
        env:
          DEV_TO_PUBLISH_KEY: ${{ secrets.DEV_TO_PUBLISH_KEY }}
