name: Deploy the portfolio

# www.siddharthabbineni.in, from apps/portfolio. The blog has its own workflow and Azure apps.
on:
  push:
    branches:
      - master
    paths:
      - apps/portfolio/**
      - .github/workflows/deploy-portfolio.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # signs in to Azure with GitHub's OIDC token, so no Azure password is stored
      id-token: write

    env:
      SWA_TOKEN: ${{ secrets.AZURE_SWA_DEPLOY_TOKEN_PROD }}

    defaults:
      run:
        working-directory: apps/portfolio

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # the same Node the server runs on in Azure (engines in package.json)
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portfolio/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/portfolio/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/portfolio/package-lock.json') }}-${{ hashFiles('apps/portfolio/**/*.ts', 'apps/portfolio/**/*.tsx', 'apps/portfolio/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/portfolio/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
          XBOX_API_KEY: ${{ secrets.XBOX_API_KEY }}
          # Raises the GitHub search limit for the PR ticker; optional
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The server refreshes Steam and Xbox every few hours with keys from its own
      # app settings, not GitHub's. Copying them on each deploy keeps one place
      # to change them: the GitHub secrets.
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Copy the API keys to the Azure server
        run: >-
          az staticwebapp appsettings set
          --name "$APP" --resource-group Website --output none
          --setting-names "STEAM_API_KEY=$STEAM_API_KEY" "STEAM_USER_ID=$STEAM_USER_ID" "XBOX_API_KEY=$XBOX_API_KEY"
        env:
          APP: wapenshaw-site
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
          XBOX_API_KEY: ${{ secrets.XBOX_API_KEY }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: apps/portfolio
          output_location: .next
          skip_app_build: true
