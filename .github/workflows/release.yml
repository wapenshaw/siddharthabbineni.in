name: Release

# Keeps a release PR open that bumps package.json and CHANGELOG.md from the
# Conventional Commit titles merged into master. Merging that PR tags the release.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
